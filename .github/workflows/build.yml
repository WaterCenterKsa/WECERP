name: WEC ERP Build

concurrency:
  group: wecerp-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WecErp.sln

      - name: Restore EF Tools
        run: dotnet tool restore

      - name: Validate EF DbContext
        run: dotnet ef dbcontext info --verbose --project src/WecErp.Infrastructure/WecErp.Infrastructure.vbproj --startup-project src/WecErp.Api/WecErp.Api.csproj

      - name: Restore Tests
        run: dotnet restore tests/WecErp.Application.Tests/WecErp.Application.Tests.vbproj

      - name: Build Domain
        run: dotnet build src/WecErp.Domain/WecErp.Domain.vbproj --configuration Release --no-restore

      - name: Build Application
        run: dotnet build src/WecErp.Application/WecErp.Application.vbproj --configuration Release --no-restore

      - name: Build Infrastructure
        run: dotnet build src/WecErp.Infrastructure/WecErp.Infrastructure.vbproj --configuration Release --no-restore

      - name: Build Migrations
        run: dotnet build src/WecErp.Infrastructure.Migrations/WecErp.Infrastructure.Migrations.csproj --configuration Release --no-restore

      - name: Validate migrations
        run: dotnet ef migrations list --project src/WecErp.Infrastructure.Migrations/WecErp.Infrastructure.Migrations.csproj --startup-project src/WecErp.Infrastructure.Migrations/WecErp.Infrastructure.Migrations.csproj --context ErpDbContext

      - name: Build API
        run: dotnet build src/WecErp.Api/WecErp.Api.csproj --configuration Release --no-restore

      - name: Build Desktop
        run: dotnet build src/WecErp.Desktop/WecErp.Desktop.vbproj --configuration Release --no-restore

      - name: Build Application Tests
        run: dotnet build tests/WecErp.Application.Tests/WecErp.Application.Tests.vbproj --configuration Release --no-restore

      - name: Build API Tests
        run: dotnet build tests/WecErp.Api.Tests/WecErp.Api.Tests.csproj --configuration Release --no-restore

      - name: Test Application
        run: dotnet test tests/WecErp.Application.Tests/WecErp.Application.Tests.vbproj --configuration Release --no-build --no-restore

  api-sql-integration:
    needs: build
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          MSSQL_SA_PASSWORD: "WECERP_SqlTest_2026!"
        ports:
          - 1433:1433
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wait for SQL Server
        shell: bash
        run: |
          for i in {1..90}; do
            if (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1; then
              echo "SQL Server TCP port is ready."
              break
            fi
            sleep 2
          done

          for i in {1..180}; do
            if /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P 'WECERP_SqlTest_2026!' -C -d master -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server accepts authenticated connections."
              exit 0
            fi
            sleep 2
          done

          echo "SQL Server did not become ready for authenticated connections."
          exit 1

      - name: Restore
        run: dotnet restore tests/WecErp.Api.Tests/WecErp.Api.Tests.csproj

      - name: Run SQL-backed ERP integration tests
        env:
          WECERP_TEST_CONNECTION: "Server=localhost,1433;Database=WecErp_ApiTest;User Id=sa;Password=WECERP_SqlTest_2026!;TrustServerCertificate=True;Encrypt=False;Connect Timeout=60"
        run: dotnet test tests/WecErp.Api.Tests/WecErp.Api.Tests.csproj --configuration Release --no-restore
