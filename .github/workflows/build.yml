name: WEC ERP Build

concurrency:
  group: wecerp-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WecErp.sln

      - name: Restore EF Tools
        run: dotnet tool restore

      - name: Validate EF DbContext
        run: dotnet ef dbcontext info --verbose --project src/WecErp.Infrastructure/WecErp.Infrastructure.vbproj --startup-project src/WecErp.Api/WecErp.Api.csproj

      - name: Restore Tests
        run: dotnet restore tests/WecErp.Application.Tests/WecErp.Application.Tests.vbproj

      - name: Build Domain
        run: dotnet build src/WecErp.Domain/WecErp.Domain.vbproj --configuration Release --no-restore

      - name: Build Application
        run: dotnet build src/WecErp.Application/WecErp.Application.vbproj --configuration Release --no-restore

      - name: Build Infrastructure
        run: dotnet build src/WecErp.Infrastructure/WecErp.Infrastructure.vbproj --configuration Release --no-restore

      - name: Build API
        run: dotnet build src/WecErp.Api/WecErp.Api.csproj --configuration Release --no-restore

      - name: Build Desktop
        run: dotnet build src/WecErp.Desktop/WecErp.Desktop.vbproj --configuration Release --no-restore

      - name: Build Tests
        run: dotnet build tests/WecErp.Application.Tests/WecErp.Application.Tests.vbproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/WecErp.Application.Tests/WecErp.Application.Tests.vbproj --configuration Release --no-build --no-restore
