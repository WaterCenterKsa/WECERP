name: WEC ERP Build

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WecErp.sln

      - name: Build
        run: dotnet build WecErp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WecErp.sln --configuration Release --no-build --no-restore
